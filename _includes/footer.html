<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper footer-wrapper">
    <div class="footer-left">
      <div class="footer-brand">
        <div class="site-logo-icon footer-logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2v7.31"></path>
            <path d="M14 9.3V2"></path>
            <path d="M8.5 2h7"></path>
            <path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path>
            <path d="M5.52 16h12.96"></path>
          </svg>
        </div>
        <span class="site-title-text footer-title-text">{{ site.title | escape }}</span>
        <span class="footer-copy">© {{ 'now' | date: "%Y" }} Crafted for Ruby Indie Hackers & Builders.</span>
      </div>
      <p class="footer-description">{{ site.description | escape }}</p>
    </div>

    <div class="footer-right">
      <div class="footer-links">
        <a href="{{ "/blog/" | relative_url }}">Blog</a>
        <a href="{{ "/about/" | relative_url }}">About</a>
        <a href="https://www.enkihost.com" target="_blank" rel="noopener">Enkihost.com ↗</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
        {%- if site.twitter_username -%}
        <a href="https://twitter.com/{{ site.twitter_username }}" target="_blank" rel="noopener">Twitter</a>
        {%- endif -%}
      </div>
    </div>
  </div>
</footer>
